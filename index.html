<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <meta name="description" content="A simple, modern, user-friendly calculator that performs basic arithmetic operations using HTML5, CSS3, and Vanilla JavaScript.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Main Container -->
  <main class="calculator-container" role="region" aria-label="Calculator">
    <header class="calculator-header">
      <h1 class="calculator-title" id="calculator-heading">Calculator</h1>
      <div class="solar-panel" aria-hidden="true" title="Solar cell">
        <span class="solar-cell"></span>
        <span class="solar-cell"></span>
        <span class="solar-cell"></span>
        <span class="solar-cell"></span>
      </div>
    </header>

    <!-- Calculator Display Screen -->
    <section class="calculator-display" aria-live="polite" aria-atomic="true">
      <!-- Upper line: shows previous operand, operator, and expression history -->
      <div class="display-history" id="display-history" aria-label="Expression history">&nbsp;</div>
      <!-- Lower line: shows current input or calculated result -->
      <div class="display-current" id="display-current" aria-label="Current input or result">0</div>
    </section>

    <!-- Calculator Keypad (CSS Grid) -->
    <div class="calculator-keypad" role="group" aria-label="Calculator buttons">
      <!-- Row 1 -->
      <button type="button" class="btn btn-action btn-clear" id="btn-clear" data-action="clear" aria-label="Clear all">C</button>
      <button type="button" class="btn btn-action btn-backspace" id="btn-backspace" data-action="backspace" aria-label="Backspace">⌫</button>
      <button type="button" class="btn btn-operator" id="btn-divide" data-operator="/" aria-label="Divide">÷</button>

      <!-- Row 2 -->
      <button type="button" class="btn btn-number" id="btn-7" data-number="7">7</button>
      <button type="button" class="btn btn-number" id="btn-8" data-number="8">8</button>
      <button type="button" class="btn btn-number" id="btn-9" data-number="9">9</button>
      <button type="button" class="btn btn-operator" id="btn-multiply" data-operator="*" aria-label="Multiply">×</button>

      <!-- Row 3 -->
      <button type="button" class="btn btn-number" id="btn-4" data-number="4">4</button>
      <button type="button" class="btn btn-number" id="btn-5" data-number="5">5</button>
      <button type="button" class="btn btn-number" id="btn-6" data-number="6">6</button>
      <button type="button" class="btn btn-operator" id="btn-subtract" data-operator="-" aria-label="Subtract">−</button>

      <!-- Row 4 -->
      <button type="button" class="btn btn-number" id="btn-1" data-number="1">1</button>
      <button type="button" class="btn btn-number" id="btn-2" data-number="2">2</button>
      <button type="button" class="btn btn-number" id="btn-3" data-number="3">3</button>
      <button type="button" class="btn btn-operator" id="btn-add" data-operator="+" aria-label="Add">+</button>

      <!-- Row 5 -->
      <button type="button" class="btn btn-number btn-zero" id="btn-0" data-number="0">0</button>
      <button type="button" class="btn btn-number" id="btn-decimal" data-action="decimal" aria-label="Decimal point">.</button>
      <button type="button" class="btn btn-equals" id="btn-equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="./script.js"></script>
</body>
</html>
